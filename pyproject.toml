[project]
name = "mirrordash-krisinformation"
version = "0.1.0"
description = "Swedish crisis and societal disruption information from Krisinformation.se"
requires-python = ">=3.14"
authors = [
    { name = "MirrorDash Developer" }
]
dependencies = [
    "jinja2"
]

[project.entry-points."mirrordash.modules"]
mirrordash_krisinformation = "mirrordash_krisinformation.plugin:KrisinformationModule"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrordash_krisinformation"]
